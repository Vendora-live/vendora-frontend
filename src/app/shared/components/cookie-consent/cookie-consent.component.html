@if (visible) {
<div class="cookie-card">
    <div class="cookie-header">
        <svg class="cookie-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/>
            <path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/>
        </svg>
        <span class="cookie-title">{{ 'COOKIE.title' | translate }}</span>
    </div>
    <p class="cookie-message">{{ 'COOKIE.message' | translate }}</p>
    <button class="cookie-btn" (click)="accept()">{{ 'COOKIE.accept' | translate }}</button>
</div>
}
