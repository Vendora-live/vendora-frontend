<nav class="breadcrumb" *ngIf="items && items.length > 0" aria-label="breadcrumb">
  <ng-container *ngFor="let item of items; let last = last">
    <a *ngIf="item.route && !last"
       [routerLink]="item.route"
       class="breadcrumb-link">{{ item.label }}</a>
    <span *ngIf="!item.route || last"
          class="breadcrumb-current"
          [class.last]="last">{{ item.label }}</span>
    <span *ngIf="!last" class="breadcrumb-sep">›</span>
  </ng-container>
</nav>
