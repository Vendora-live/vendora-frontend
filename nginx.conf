server {
    listen 80;

    root /usr/share/nginx/html/browser;
    index index.html;

    # SSE endpoint — buffering kapalı olmalı, yoksa eventler bloklanır
    location /api/notifications/stream {
        proxy_pass http://backend:8080/api/notifications/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Proxy /api isteklerini backend'e yönlendir
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA — tüm rotaları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
